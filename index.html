マイク（🎙️）のアイコンを標準装備した、最新の完全版HTMLコード（index.html）をご用意しました！
スマホのホーム画面に「ホーム画面に追加」したとき、綺麗に🎙️のアイコンが並ぶ仕様になっています。このままコピーして置き換えてご利用ください。
アプリ側コード (index.html・🎙️アイコン対応版)
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>録音部 スクリプト管理</title>
    <!-- ホーム画面用アイコン（🎙️） -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; }
        input, textarea { background-color: #2d2d2d; color: #ffffff; border: 1px solid #444; padding: 8px; border-radius: 4px; width: 100%; }
        input:focus, textarea:focus { outline: none; border-color: #4CAF50; }
        .btn { padding: 12px; border-radius: 6px; font-weight: bold; text-align: center; cursor: pointer; }
        .btn-ok { background-color: #4CAF50; color: white; }
        .btn-keep { background-color: #FFC107; color: black; }
        .btn-ng { background-color: #F44336; color: white; }
        .btn-save { background-color: #2196F3; color: white; font-size: 1.1rem; }
        .btn-submit { background-color: #9C27B0; color: white; font-size: 1.1rem; margin-top: 10px; }
        .btn-submitting { background-color: #7b1fa2; color: #ccc; cursor: not-allowed; }
        .history-item { background-color: #1e1e1e; border-left: 4px solid #444; padding: 10px; margin-bottom: 8px; border-radius: 4px; }
        .history-ok { border-color: #4CAF50; }
        .history-keep { border-color: #FFC107; }
        .history-ng { border-color: #F44336; }
        .modal { background-color: rgba(0,0,0,0.8); position: fixed; top:0; left:0; width:100%; height:100%; display:flex; justify-content:center; align-items:center; z-index:100; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        function App() {
            const loadProjectHistory = () => {
                const saved = localStorage.getItem('projectHistory');
                return saved ? JSON.parse(saved) : [];
            };
            const loadSceneHistory = () => {
                const saved = localStorage.getItem('sceneHistory');
                return saved ? JSON.parse(saved) : [];
            };
            const loadCutHistory = () => {
                const saved = localStorage.getItem('cutHistory');
                return saved ? JSON.parse(saved) : ["A", "B", "C"];
            };
            const loadChannelHistory = () => {
                const saved = localStorage.getItem('channelHistory');
                return saved ? JSON.parse(saved) : ["ガン", "ピン1", "", "", "", "", "", ""];
            };
            const loadFolderId = () => {
                return localStorage.getItem('targetFolderId') || "";
            };

            const today = new Date().toISOString().split('T')[0];
            const [project, setProject] = useState("");
            const [projectHistory, setProjectHistory] = useState(loadProjectHistory());
            
            const [date, setDate] = useState(today);
            const [roll, setRoll] = useState("R-01");
            const [scene, setScene] = useState("1");
            const [sceneHistory, setSceneHistory] = useState(loadSceneHistory());
            
            const [cut, setCut] = useState("A");
            const [cutHistory, setCutHistory] = useState(loadCutHistory());
            
            const [take, setTake] = useState(1);
            const [fileNo, setFileNo] = useState("");
            
            const [evaluation, setEvaluation] = useState("OK");
            const [memo, setMemo] = useState("");
            const [channels, setChannels] = useState(loadChannelHistory());
            
            const [history, setHistory] = useState([]);
            const [editingIndex, setEditingIndex] = useState(null);
            const [isSubmitting, setIsSubmitting] = useState(false);

            const [currentTab, setCurrentTab] = useState("recorder");
            const [showSettings, setShowSettings] = useState(false);
            const [folderInput, setFolderInput] = useState(loadFolderId());

            const handleFolderInputChange = (e) => {
                const input = e.target.value;
                setFolderInput(input);
                if (!input.trim()) return;

                const folderMatch = input.match(/\/folders\/([a-zA-Z0-9_-]+)/);
                if (folderMatch && folderMatch[1]) {
                    setFolderInput(folderMatch[1]);
                    return;
                }
                const queryMatch = input.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                if (queryMatch && queryMatch[1]) {
                    setFolderInput(queryMatch[1]);
                    return;
                }
            };

            const handleChannelChange = (index, value) => {
                const newChannels = [...channels];
                newChannels[index] = value;
                setChannels(newChannels);
                localStorage.setItem('channelHistory', JSON.stringify(newChannels));
            };

            const handleProjectChange = (e) => {
                const newProject = e.target.value;
                setProject(newProject);
                if (project !== "" && newProject !== project) {
                    const resetChannels = ["", "", "", "", "", "", "", ""];
                    setChannels(resetChannels);
                    localStorage.setItem('channelHistory', JSON.stringify(resetChannels));
                }
            };

            const saveSettings = () => {
                localStorage.setItem('targetFolderId', folderInput.trim());
                setShowSettings(false);
                alert("保存先フォルダIDを更新しました！");
            };

            const openFlightradar = () => {
                window.open("https://www.flightradar24.com/", "_blank");
            };

            const handleRecordTake = () => {
                const currentData = { project, date, roll, scene, cut, take, fileNo, evaluation, memo, channels: [...channels] };
                
                if (project && !projectHistory.includes(project)) {
                    const newProjHistory = [project, ...projectHistory];
                    setProjectHistory(newProjHistory);
                    localStorage.setItem('projectHistory', JSON.stringify(newProjHistory));
                }

                if (scene && !sceneHistory.includes(scene)) {
                    const newSceneHistory = [scene, ...sceneHistory];
                    setSceneHistory(newSceneHistory);
                    localStorage.setItem('sceneHistory', JSON.stringify(newSceneHistory));
                }

                if (cut && !cutHistory.includes(cut)) {
                    const newCutHistory = [cut, ...cutHistory];
                    setCutHistory(newCutHistory);
                    localStorage.setItem('cutHistory', JSON.stringify(newCutHistory));
                }

                if (editingIndex !== null) {
                    const newHistory = [...history];
                    newHistory[editingIndex] = currentData;
                    setHistory(newHistory);
                    setEditingIndex(null);
                    setTake(prev => prev + 1);
                } else {
                    setHistory([currentData, ...history]); 
                    setTake(prev => prev + 1);
                }
                
                setFileNo("");
                setMemo("");
                setEvaluation("OK");
            };

            const handleEdit = (index) => {
                const item = history[index];
                setProject(item.project);
                setDate(item.date);
                setRoll(item.roll);
                setScene(item.scene);
                setCut(item.cut);
                setTake(item.take);
                setFileNo(item.fileNo || "");
                setEvaluation(item.evaluation);
                setMemo(item.memo);
                setChannels([...item.channels]);
                setEditingIndex(index);
                setCurrentTab("recorder");
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleBatchSubmit = async () => {
                if (isSubmitting) return;
                if (history.length === 0) {
                    alert("送信するデータがありません。");
                    return;
                }
                if (!project) {
                    alert("作品名を入力してください。");
                    return;
                }

                const currentFolderId = localStorage.getItem('targetFolderId');
                if (!currentFolderId) {
                    alert("保存先のGoogleドライブ フォルダIDが設定されていません。\n右上の⚙️設定ボタンからフォルダIDを設定してください。");
                    setShowSettings(true);
                    return;
                }

                // ==========================================
                // ★★★★★ ここにGASのURLを貼り付けてください ★★★★★
                // ==========================================
                const gasUrl = "★ここにGASのURLを貼り付けてください★";
                
                if (gasUrl.includes("★ここ")) {
                    alert("GASのURLが設定されていません。コード内のgasUrlを書き換えてください。");
                    return;
                }

                setIsSubmitting(true);
                
                const payload = {
                    project: project,
                    folderId: currentFolderId,
                    records: [...history].reverse() 
                };

                try {
                    const response = await fetch(gasUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload)
                    });
                    
                    const result = await response.json();
                    
                    if (result.status === "success") {
                        alert(`${history.length}件のテイクをスプレッドシートに送信しました！`);
                        setHistory([]); 
                    } else {
                        alert("送信エラー: " + result.message);
                    }
                } catch (error) {
                    alert("送信に失敗しました。電波状況を確認してください。\n(データはアプリ内に残っています)");
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="max-w-md mx-auto p-4 pb-20">
                    <div className="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
                        <div className="flex items-center gap-2">
                            <h1 className="text-lg font-bold text-gray-200">🎙️ 録音スクリプト</h1>
                            <button onClick={() => setShowSettings(true)} className="bg-gray-700 text-gray-200 px-2 py-1 rounded text-xs">
                                ⚙️ 設定
                            </button>
                        </div>
                        <div className="flex gap-1">
                            <button 
                                onClick={() => setCurrentTab("recorder")} 
                                className={`px-3 py-1 rounded text-xs font-bold ${currentTab === 'recorder' ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-400'}`}
                            >
                                📝 記録
                            </button>
                            <button 
                                onClick={() => setCurrentTab("manual")} 
                                className={`px-3 py-1 rounded text-xs font-bold ${currentTab === 'manual' ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-400'}`}
                            >
                                📖 使い方
                            </button>
                            <button onClick={openFlightradar} className="bg-blue-900 text-white px-2 py-1 rounded text-xs">
                                ✈️
                            </button>
                        </div>
                    </div>

                    {showSettings && (
                        <div className="modal p-4">
                            <div className="bg-gray-800 p-4 rounded-lg w-full max-w-sm border border-gray-700">
                                <h2 className="text-lg font-bold mb-2 text-white">⚙️ 保存先設定</h2>
                                <p className="text-xs text-gray-400 mb-2">
                                    Googleドライブの<b>フォルダのURL</b>をそのまま貼り付けてください。自動でIDが抽出されます。
                                </p>
                                <textarea 
                                    value={folderInput} 
                                    onChange={handleFolderInputChange} 
                                    placeholder="https://drive.google.com/drive/folders/..." 
                                    rows="3"
                                    className="mb-4 text-sm font-mono"
                                ></textarea>
                                <div className="flex gap-2">
                                    <button onClick={saveSettings} className="flex-1 bg-blue-600 text-white py-2 rounded font-bold">保存する</button>
                                    <button onClick={() => setShowSettings(false)} className="flex-1 bg-gray-600 text-white py-2 rounded">閉じる</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {currentTab === 'recorder' && (
                        <div>
                            <div className="grid grid-cols-2 gap-2 mb-4">
                                <div>
                                    <label className="text-xs text-gray-400">作品名</label>
                                    <input 
                                        type="text" 
                                        value={project} 
                                        onChange={handleProjectChange} 
                                        placeholder="映画タイトルなど" 
                                        list="project-list"
                                    />
                                    <datalist id="project-list">
                                        {projectHistory.map((pName, idx) => (
                                            <option key={idx} value={pName} />
                                        ))}
                                    </datalist>
                                </div>
                                <div>
                                    <label className="text-xs text-gray-400">日付</label>
                                    <input type="date" value={date} onChange={(e) => setDate(e.target.value)} />
                                </div>
                            </div>

                            <div className="grid grid-cols-4 gap-2 mb-4">
                                <div>
                                    <label className="text-xs text-gray-400">ロール</label>
                                    <input type="text" value={roll} onChange={(e) => setRoll(e.target.value)} />
                                </div>
                                <div>
                                    <label className="text-xs text-gray-400">シーン</label>
                                    <input 
                                        type="text" 
                                        value={scene} 
                                        onChange={(e) => { setScene(e.target.value); setTake(1); }} 
                                        list="scene-list"
                                    />
                                    <datalist id="scene-list">
                                        {sceneHistory.map((sNum, idx) => (
                                            <option key={idx} value={sNum} />
                                        ))}
                                    </datalist>
                                </div>
                                <div>
                                    <label className="text-xs text-gray-400">カット</label>
                                    <input 
                                        type="text" 
                                        value={cut} 
                                        onChange={(e) => { setCut(e.target.value); setTake(1); }} 
                                        list="cut-list"
                                    />
                                    <datalist id="cut-list">
                                        {cutHistory.map((cName, idx) => (
                                            <option key={idx} value={cName} />
                                        ))}
                                    </datalist>
                                </div>
                                <div>
                                    <label className="text-xs text-gray-400">テイク</label>
                                    <input type="number" value={take} onChange={(e) => setTake(Number(e.target.value))} />
                                </div>
                            </div>

                            <div className="mb-4">
                                <label className="text-xs text-gray-400">レコーダー ファイル番号 (例: T0123)</label>
                                <input 
                                    type="text" 
                                    value={fileNo} 
                                    onChange={(e) => setFileNo(e.target.value)} 
                                    placeholder="例: T0123" 
                                />
                            </div>

                            <div className="flex gap-2 mb-4">
                                <div className={`flex-1 btn ${evaluation === 'OK' ? 'btn-ok' : 'bg-gray-700'}`} onClick={() => setEvaluation('OK')}>OK</div>
                                <div className={`flex-1 btn ${evaluation === 'KEEP' ? 'btn-keep' : 'bg-gray-700'}`} onClick={() => setEvaluation('KEEP')}>KEEP</div>
                                <div className={`flex-1 btn ${evaluation === 'NG' ? 'btn-ng' : 'bg-gray-700'}`} onClick={() => setEvaluation('NG')}>NG</div>
                            </div>

                            <div className="mb-4">
                                <label className="text-xs text-gray-400">備考 (ノイズ・セリフかぶり等)</label>
                                <textarea value={memo} onChange={(e) => setMemo(e.target.value)} rows="2"></textarea>
                            </div>

                            <div className="mb-6">
                                <label className="text-xs text-gray-400 mb-1 block">マイク / チャンネル (Ch1 - Ch8)</label>
                                <div className="grid grid-cols-2 gap-2">
                                    {channels.map((ch, idx) => (
                                        <div key={idx} className="flex items-center">
                                            <span className="text-xs text-gray-500 w-8">Ch{idx + 1}</span>
                                            <input type="text" value={ch} onChange={(e) => handleChannelChange(idx, e.target.value)} className="text-sm" placeholder="マイク名" />
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className={`btn w-full ${editingIndex !== null ? 'bg-orange-500 text-white' : 'btn-save'}`} onClick={handleRecordTake}>
                                {editingIndex !== null ? '修正を反映する' : 'テイクを記録（アプリ内に保存）'}
                            </div>

                            {history.length > 0 && (
                                <div className="mt-8">
                                    <h2 className="text-lg font-bold text-gray-300 mb-3 border-b border-gray-600 pb-1">保存待ちのテイク ({history.length}件)</h2>
                                    {history.map((item, index) => {
                                        let evClass = "history-ok";
                                        if (item.evaluation === "KEEP") evClass = "history-keep";
                                        if (item.evaluation === "NG") evClass = "history-ng";

                                        return (
                                            <div key={index} className={`history-item ${evClass} flex justify-between items-center`}>
                                                <div>
                                                    <div className="font-bold text-sm">
                                                        Sc:{item.scene} / Cut:{item.cut} / Tk:{item.take} {item.fileNo ? `(` + item.fileNo + `)` : ''}
                                                        <span className="ml-2 text-xs px-2 py-1 bg-gray-700 rounded">{item.evaluation}</span>
                                                    </div>
                                                    {item.memo && <div className="text-xs text-gray-400 mt-1">{item.memo}</div>}
                                                </div>
                                                <button onClick={() => handleEdit(index)} className="text-xs bg-gray-600 px-3 py-2 rounded">修正</button>
                                            </div>
                                        )
                                    })}
                                    
                                    <div className={`btn w-full mt-4 ${isSubmitting ? 'btn-submitting' : 'btn-submit'}`} onClick={handleBatchSubmit}>
                                        {isSubmitting ? '送信中...' : 'スプレッドシートへ一括送信 🚀'}
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {currentTab === 'manual' && (
                        <div className="text-sm text-gray-300 space-y-4">
                            <div className="bg-gray-800 p-4 rounded-lg border border-gray-700">
                                <h3 className="font-bold text-white text-base mb-2">📌 このアプリの使い方</h3>
                                <ol className="list-decimal list-inside space-y-2 text-xs text-gray-300">
                                    <li><b>初期設定:</b> 画面左上の「⚙️設定」ボタンを押し、Googleドライブの保存先フォルダのURLを貼り付けて保存します。</li>
                                    <li><b>テイク記録:</b> シーン・カット・テイク・ファイル番号などを入力し、「テイクを記録」を押します。</li>
                                    <li><b>一括送信:</b> 休憩時などに「スプレッドシートへ一括送信」を押すと、あなたのGoogleドライブ内に作品ごとのスプレッドシートが自動作成され、日付ごとにシートが分かれて記録されます。</li>
                                </ol>
                            </div>

                            <div className="bg-gray-800 p-4 rounded-lg border border-gray-700">
                                <h3 className="font-bold text-white text-base mb-2">📁 フォルダID（URL）の取得方法</h3>
                                <ol className="list-decimal list-inside space-y-2 text-xs text-gray-300">
                                    <li>Googleドライブアプリ（またはブラウザ）で、保存先にしたいフォルダを開きます。</li>
                                    <li>フォルダの共有リンク（またはURL）をコピーします。</li>
                                    <li>本アプリの「⚙️設定」を開き、URLをそのまま貼り付けます（自動でIDが抽出されます）。</li>
                                </ol>
                            </div>

                            <div className="bg-gray-800 p-4 rounded-lg border border-gray-700">
                                <h3 className="font-bold text-white text-base mb-2">⚠️ 初回送信時の注意点</h3>
                                <p className="text-xs text-gray-300 leading-relaxed">
                                    初めて「一括送信」を行う際、Googleのセキュリティ画面（「このアプリはGoogleで確認されていません」）が表示されることがあります。その場合は、<b>「詳細」 ＞ 「安全ではないページに移動」 ＞ 「許可」</b>の順に進めてください。これはご自身のドライブに安全に書き込むための初回の承認となります（2回目以降は出ません）。
                                </p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
